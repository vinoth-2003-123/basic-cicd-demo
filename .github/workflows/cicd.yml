name: Basic CI-CD Pipeline

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

jobs:
build:
name: Build Application
runs-on: ubuntu-latest
steps:
- name: Checkout source code
uses: actions/checkout@v4

```
  - name: Check application file
    run: test -f index.html

  - name: Prepare deployment files
    run: mkdir -p public && cp index.html public/index.html

  - name: Upload deployment artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: public
```

test:
name: Test Application
runs-on: ubuntu-latest
steps:
- name: Checkout source code
uses: actions/checkout@v4

```
  - name: Test page heading
    run: grep -q "Welcome to My CI/CD Demo" index.html

  - name: Test deployment message
    run: grep -q "deployed successfully" index.html
```

deploy:
name: Deploy Application
needs: [build, test]
runs-on: ubuntu-latest
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
steps:
- name: Deploy to GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
